
services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./leetcode-or-explode.crt:/etc/ssl/certs/leetcode-or-explode.crt:ro
      - ./leetcode-or-explode.key:/etc/ssl/private/leetcode-or-explode.key:ro
    depends_on:
      - chromeL
    restart: unless-stopped

  chromeL:
    image: us-central1-docker.pkg.dev/lcc-backend/lcc-backend/chrome-l:latest
    expose:
      - "9100"
    volumes:
      - ./.env:/app/.env
    environment:
      - ENV=production
      - DNS_DB=${DNS_DB}
      - googleClientID=${googleClientID}
    restart: unless-stopped

  discordbot:
    image: us-central1-docker.pkg.dev/lcc-backend/lcc-backend/discordbot:latest
    container_name: discordbot
    ports:
      - "9200:9200"
    volumes:
      - ./.env:/app/.env
    environment:
      - ENV=production
      - DNS_DB=${DNS_DB}
      - DISCORD_TOKEN=${DISCORD_TOKEN}

    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.1.0
    container_name: grafana-alloy
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy
    environment:
      - ALLOY_CONFIG_FILE=/etc/alloy/config.alloy
    restart: unless-stopped
